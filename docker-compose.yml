services:
  ngnix:
    image: nginx:latest
    ports:
      - "800:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - server1
      - server2
      - server3

  server1:
    build: ./Server
    env_file:
      - ./Server/.env
    environment:
      - SERVER_NAME=Server 1 (Port 3000)
      - REDIS_URL=redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      - redis

  server2:
    build: ./Server
    env_file:
      - ./Server/.env
    environment:
      - SERVER_NAME=Server 2 (Port 3001)
      - REDIS_URL=redis://redis:6379
    ports:
      - "3001:3000"
    depends_on:
      - redis

  server3:
    build: ./Server
    env_file:
      - ./Server/.env
    environment:
      - SERVER_NAME=Server 3 (Port 3002)
      - REDIS_URL=redis://redis:6379
    ports:
      - "3002:3000"
    depends_on:
      - redis

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"